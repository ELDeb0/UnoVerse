<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnoVerse | SECURE CHECKOUT</title>
    
    <link rel="icon" type="image/png" href="icon.png">
    
    <!-- مكتبات Firebase السحابية -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- خطوط UnoVerse -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;700&family=Playfair+Display:ital,wght@0,700;1,700&family=Tajawal:wght@300;400;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* ================= الهوية البصرية الأرشيفية ================= */
        :root {
            --bg-deep: #04060A;       
            --bg-card: #080C14;       
            --text-cream: #E6E1D6;    
            --text-muted: #6B8096;    
            --accent-blue: #4A6B8C;   
            --line-color: rgba(230, 225, 214, 0.08); 
        }

        /* إخفاء الماوس الأصلي بشكل إجباري وقاطع من كل العناصر */
        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; cursor: none !important; }
        *, *::before, *::after { cursor: none !important; }
        
        body { 
            background-color: var(--bg-deep); 
            color: var(--text-cream); 
            font-family: 'Tajawal', sans-serif; 
            overflow-x: hidden; 
            -webkit-font-smoothing: antialiased; 
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
            -webkit-touch-callout: none;
            background-image: url("data:image/svg+xml,%3Csvg width='800' height='800' viewBox='0 0 800 800' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='400' cy='400' r='399' fill='none' stroke='%23E6E1D6' stroke-opacity='0.03' stroke-width='1' stroke-dasharray='4 12'/%3E%3Ccircle cx='400' cy='400' r='200' fill='none' stroke='%23E6E1D6' stroke-opacity='0.02' stroke-width='1' stroke-dasharray='4 12'/%3E%3C/svg%3E");
            background-attachment: fixed;
            background-position: center;
        }

        img { -webkit-user-drag: none; user-drag: none; pointer-events: none; }
        button, input, textarea, a, label { pointer-events: auto; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 10px; }

        /* ================= النسيج السينمائي ================= */
        .cinematic-grain { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            pointer-events: none; z-index: 99998; opacity: 0.05; 
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); 
            will-change: transform; transform: translateZ(0); 
        }

        /* ================= الماوس المخصص ================= */
        .cursor-wrapper { 
            position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999999; 
            will-change: transform; mix-blend-mode: exclusion;
        }
        .cursor-dot { 
            width: 12px; height: 12px; background-color: var(--text-cream); border-radius: 50%;
            transform: translate(-50%, -50%) scale(1); 
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.25s ease, box-shadow 0.25s ease; 
        }
        .cursor-wrapper.hovered .cursor-dot { 
            transform: translate(-50%, -50%) scale(5); 
            background-color: transparent; border: 1px solid var(--text-cream); box-shadow: none; 
        }

        /* ================= خلفية الحروف الإنجليزية الفاخرة ================= */
        .eng-typography-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; gap: 5vh; }
        .eng-typography-bg .word-1 { font-family: 'Oswald', sans-serif; font-size: 18vw; font-weight: 700; color: rgba(132, 155, 179, 0.08); line-height: 0.8; white-space: nowrap; will-change: transform; animation: smoothPanRight 45s linear infinite; transform: translateZ(0);}
        .eng-typography-bg .word-2 { font-family: 'Playfair Display', serif; font-size: 15vw; font-weight: 900; font-style: italic; color: rgba(132, 155, 179, 0.05); line-height: 0.8; white-space: nowrap; will-change: transform; animation: smoothPanLeft 55s linear infinite; transform: translateZ(0);}
        @keyframes smoothPanRight { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(50%, 0, 0); } }
        @keyframes smoothPanLeft { 0% { transform: translate3d(50%, 0, 0); } 100% { transform: translate3d(0, 0, 0); } }

        /* ================= شاشة التحميل ================= */
        #loader-overlay { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: var(--bg-deep); z-index: 9999999; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; 
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.8s ease; 
        }
        .loader-logo { 
            font-family: 'Oswald', sans-serif; font-size: 50px; color: var(--text-cream); 
            letter-spacing: 12px; margin-bottom: 10px; font-weight: 700; direction: ltr;
        }
        .loader-logo span { color: var(--text-muted); }
        .loader-line-container { width: 150px; height: 1px; background: rgba(255,255,255,0.1); overflow: hidden; position: relative;}
        #loader-line { 
            position: absolute; top: 0; left: 50%; transform: translateX(-50%); 
            width: 0%; height: 100%; background: var(--text-cream); 
            transition: width 1s cubic-bezier(0.25, 1, 0.5, 1); 
        }
        body.loaded #loader-overlay { transform: translateY(-100%); opacity: 0; pointer-events: none; }

        /* ================= الهيدر ================= */
        .main-header { 
            display: flex; justify-content: space-between; align-items: center; 
            width: 100%; height: 85px; padding: 0 6%; position: absolute; top: 0; right: 0; 
            z-index: 9999; border-bottom: 1px solid var(--line-color); background: rgba(4, 6, 10, 0.95); backdrop-filter: blur(5px);
        }
        .main-header .logo { font-family: 'Oswald', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: 6px; text-decoration: none; color: var(--text-cream); display: flex; align-items: center; height: 100%; }
        .main-header .logo span { color: var(--text-muted); font-weight: 300;}
        .header-actions .action-link { color: var(--text-muted); font-family: 'Oswald', sans-serif; text-decoration: none; font-size: 11px; font-weight: 300; transition: 0.3s; letter-spacing: 4px; text-transform: uppercase; }
        .header-actions .action-link:hover { color: var(--text-cream); }

        /* ================= CHECKOUT LAYOUT ================= */
        .checkout-wrapper {
            position: relative; z-index: 10; display: flex; gap: 5%; padding: 130px 6% 80px; max-width: 1400px; margin: 0 auto; min-height: 100vh;
        }

        /* اللوحة اليمين (بيانات الشحن والدفع) */
        .checkout-form-section { flex: 1.2; }
        .section-title { font-family: 'Oswald', sans-serif; font-size: 28px; font-weight: 300; color: var(--text-cream); margin-bottom: 10px; letter-spacing: 4px; text-transform: uppercase;}
        .section-subtitle { font-family: 'Tajawal', sans-serif; font-size: 14px; color: var(--text-muted); margin-bottom: 40px; font-weight: 300;}

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: 1 / -1; }
        
        .form-group label { font-size: 11px; font-family: 'Oswald', sans-serif; color: var(--text-muted); margin-bottom: 10px; font-weight: 300; letter-spacing: 3px; text-transform: uppercase;}
        .form-group input, .form-group textarea { 
            width: 100%; padding: 15px; background: var(--bg-card); border: 1px solid var(--line-color); 
            color: var(--text-cream); font-family: 'Tajawal', sans-serif; font-size: 14px; transition: 0.3s; outline: none;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--text-cream); background: var(--bg-deep);}
        .form-group textarea { height: 100px; resize: none; }

        /* بطاقة طريقة الدفع: الدفع عند الاستلام فقط */
        .payment-cod-box {
            background: var(--bg-card); border: 1px solid var(--line-color);
            padding: 18px 20px; display: flex; align-items: center; justify-content: space-between;
            margin-top: 5px;
        }
        .payment-cod-box span { font-family: 'Tajawal', sans-serif; font-size: 14px; color: var(--text-cream); font-weight: 500;}
        .payment-cod-box .badge { font-family: 'Oswald', sans-serif; font-size: 11px; padding: 4px 10px; background: rgba(230, 225, 214, 0.08); color: var(--text-cream); border: 1px solid var(--line-color); letter-spacing: 2px;}

        .submit-order-btn {
            width: 100%; padding: 22px; background: var(--text-cream); color: var(--bg-deep); border: 1px solid var(--text-cream); 
            font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 6px; 
            transition: 0.4s; margin-top: 30px; text-transform: uppercase;
        }
        .submit-order-btn:hover { background: transparent; color: var(--text-cream); }
        .submit-order-btn:disabled { background: var(--line-color); border-color: transparent; color: var(--text-muted); }

        /* اللوحة الشمال (ملخص الطلب) */
        .order-summary-section { flex: 1; background: var(--bg-card); border: 1px solid var(--line-color); padding: 40px; height: fit-content; position: sticky; top: 120px;}
        .summary-title { font-family: 'Oswald', sans-serif; font-size: 16px; color: var(--text-cream); letter-spacing: 4px; margin-bottom: 30px; border-bottom: 1px solid var(--line-color); padding-bottom: 15px; text-transform: uppercase;}
        
        .summary-items { display: flex; flex-direction: column; gap: 20px; margin-bottom: 30px; max-height: 350px; overflow-y: auto;}
        .summary-item { display: flex; gap: 15px; align-items: center; border-bottom: 1px solid var(--line-color); padding-bottom: 15px;}
        .summary-item img { width: 60px; height: 80px; object-fit: cover; border: 1px solid var(--line-color); pointer-events: none;}
        .summary-item-info { flex: 1; }
        .summary-item-info h4 { font-size: 13px; margin-bottom: 5px; color: var(--text-cream); font-family: 'Oswald', sans-serif; text-transform: uppercase; font-weight: 400;}
        .summary-item-info p { font-size: 11px; color: var(--text-muted); font-family: 'Oswald', sans-serif; letter-spacing: 2px;}
        .summary-item-price { font-family: 'Oswald', sans-serif; font-size: 14px; color: var(--text-cream); font-weight: 300; letter-spacing: 1px;}

        .summary-totals { border-top: 1px solid var(--line-color); padding-top: 20px; display: flex; flex-direction: column; gap: 15px; }
        .total-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); font-family: 'Oswald', sans-serif; letter-spacing: 2px;}
        .total-row.final { font-size: 18px; color: var(--text-cream); font-weight: 400; border-top: 1px solid var(--line-color); padding-top: 15px;}
        
        .empty-cart-msg { text-align: center; color: var(--text-muted); padding: 50px 0; font-family: 'Oswald', sans-serif; letter-spacing: 4px; text-transform: uppercase; font-size: 12px;}

        /* ================= RESPONSIVE ================= */
        @media (max-width: 992px) {
            .main-header { padding: 15px 5%; height: 75px;}
            .main-header .logo { font-size: 20px; letter-spacing: 3px; }
            .checkout-wrapper { flex-direction: column-reverse; gap: 40px; padding: 100px 5% 50px; }
            .order-summary-section { position: relative; top: 0; padding: 25px; }
            .form-grid { grid-template-columns: 1fr; gap: 15px; }
            .cursor-wrapper { display: none !important; }
        }
    </style>
</head>
<body>

    <div class="cinematic-grain"></div>

    <div id="loader-overlay">
        <div class="loader-logo" dir="ltr">UNO<span>VERSE</span></div>
        <div class="loader-line-container">
            <div id="loader-line"></div>
        </div>
    </div>

    <!-- التايبوجرافي الخلفي -->
    <div class="eng-typography-bg">
        <div class="word-1">UNOVERSE</div>
        <div class="word-2">SECURE CHECKOUT</div>
        <div class="word-1" style="font-size: 15vw; opacity: 0.5;">PROTOCOL</div>
    </div>

    <div class="cursor-wrapper" id="cursorWrapper"><div class="cursor-dot"></div></div>

    <header class="main-header">
        <a href="index.html" class="logo" dir="ltr">UNO<span>VERSE</span></a>
        <div class="header-actions">
            <a href="index.html" class="action-link">RETURN TO ARCHIVE ✕</a>
        </div>
    </header>

    <div class="checkout-wrapper">
        <div class="checkout-form-section">
            <h2 class="section-title">SHIPPING PROTOCOL</h2>
            <p class="section-subtitle">يرجى إدخال بياناتك بدقة لضمان وصول القطعة الحصرية في أسرع وقت.</p>
            
            <form id="checkoutForm" onsubmit="submitOrder(event)">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label>الاسم بالكامل // FULL NAME</label>
                        <input type="text" id="custName" required placeholder="مثال: عمر أحمد">
                    </div>
                    
                    <div class="form-group">
                        <label>رقم الهاتف // PHONE NUMBER</label>
                        <input type="tel" id="custPhone" required pattern="^01[0125][0-9]{8}$" maxlength="11" placeholder="01xxxxxxxxx" title="برجاء إدخال رقم مصري صحيح" dir="ltr">
                    </div>
                    
                    <div class="form-group">
                        <label>رقم هاتف بديل // ALT PHONE (اختياري)</label>
                        <input type="tel" id="custAltPhone" pattern="^01[0125][0-9]{8}$" maxlength="11" placeholder="01xxxxxxxxx" title="برجاء إدخال رقم مصري صحيح" dir="ltr">
                    </div>

                    <div class="form-group">
                        <label>المحافظة // GOVERNORATE</label>
                        <input type="text" id="custGov" required placeholder="مثال: كفر الشيخ، القاهرة، الجيزة...">
                    </div>

                    <div class="form-group">
                        <label>المدينة أو المنطقة // CITY / REGION</label>
                        <input type="text" id="custCity" required placeholder="مثال: دسوق، مدينة نصر...">
                    </div>

                    <div class="form-group full-width">
                        <label>العنوان بالتفصيل // DETAILED ADDRESS</label>
                        <textarea id="custAddress" required placeholder="اسم الشارع، رقم العمارة، رقم الشقة، وأي علامة مميزة..."></textarea>
                    </div>

                    <!-- طريقة الدفع الحصرية: الدفع عند الاستلام -->
                    <div class="form-group full-width" style="margin-top: 10px;">
                        <label style="font-size: 11px;">طريقة الدفع // PAYMENT METHOD</label>
                        <div class="payment-cod-box">
                            <span>✦ الدفع عند الاستلام (CASH ON DELIVERY)</span>
                            <span class="badge">COD</span>
                        </div>
                    </div>
                </div>

                <button type="submit" class="submit-order-btn" id="submitOrderBtn">CONFIRM ORDER</button>
            </form>
        </div>

        <div class="order-summary-section">
            <h3 class="summary-title">ORDER SUMMARY</h3>
            <div class="summary-items" id="summaryItemsContainer"></div>
            <div class="summary-totals">
                <div class="total-row">
                    <span>SUBTOTAL:</span>
                    <span id="subtotalPrice">0 EGP</span>
                </div>
                <div class="total-row">
                    <span>SHIPPING:</span>
                    <span style="color: var(--text-muted);">TO BE DETERMINED</span>
                </div>
                <div class="total-row final">
                    <span>TOTAL:</span>
                    <span id="finalTotalPrice">0 EGP</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        // منع الفحص والنسخ
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', function(e) {
            if(e.keyCode == 123) return false;
            if(e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) return false;
            if(e.ctrlKey && e.keyCode == 85) return false;
            if(e.ctrlKey && e.keyCode == 67) return false;
        });

        // Firebase 
        const firebaseConfig = {
            apiKey: "AIzaSyDlDEAKoMteNLtvbSaq5I9VKpGq29gLDmY",
            authDomain: "unoverse-5babd.firebaseapp.com",
            projectId: "unoverse-5babd",
            storageBucket: "unoverse-5babd.firebasestorage.app",
            messagingSenderId: "543082257571",
            appId: "1:543082257571:web:28b1d5931cbc75e6793316"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // حركة الماوس المخصص
        const cursorWrapper = document.getElementById('cursorWrapper');
        let mouseX = -100, mouseY = -100;
        let cursorX = -100, cursorY = -100;
        document.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
        function animateCursor() {
            cursorX += (mouseX - cursorX) * 0.25; cursorY += (mouseY - cursorY) * 0.25;
            cursorWrapper.style.transform = `translate3d(${cursorX}px, ${cursorY}px, 0)`;
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        function addHover() { cursorWrapper.classList.add('hovered'); }
        function removeHover() { cursorWrapper.classList.remove('hovered'); }

        function attachCursorEffects() {
            document.querySelectorAll('a, button, input, textarea, label').forEach(el => {
                el.removeEventListener('mouseenter', addHover);
                el.removeEventListener('mouseleave', removeHover);
                el.addEventListener('mouseenter', addHover);
                el.addEventListener('mouseleave', removeHover);
            });
        }

        let currentCart = [];
        let orderTotal = 0;

        window.addEventListener('load', () => {
            const line = document.getElementById('loader-line');
            const overlay = document.getElementById('loader-overlay');
            if (line) line.style.width = '100%';
            setTimeout(() => { document.body.classList.add('loaded'); }, 1000);
            
            loadCartData();
            attachCursorEffects();
        });

        function loadCartData() {
            currentCart = JSON.parse(localStorage.getItem('unoCart')) || [];
            const container = document.getElementById('summaryItemsContainer');
            const btn = document.getElementById('submitOrderBtn');

            if (currentCart.length === 0) {
                container.innerHTML = '<div class="empty-cart-msg">EMPTY ARCHIVE. <br><br> <a href="index.html" style="color:var(--text-cream); text-decoration:none;">RETURN ✦</a></div>';
                btn.disabled = true;
                document.getElementById('subtotalPrice').innerText = '0 EGP';
                document.getElementById('finalTotalPrice').innerText = '0 EGP';
                return;
            }

            container.innerHTML = currentCart.map(item => `
                <div class="summary-item">
                    <img src="${item.image}" alt="${item.name}">
                    <div class="summary-item-info">
                        <h4>${item.name}</h4>
                        <p>SIZE: ${item.size || 'Free'}</p>
                        ${item.customDetails ? `<p style="color:#2ecc71; font-size:10px; margin-top:3px;">CUSTOM: ${item.customDetails}</p>` : ''}
                    </div>
                    <div class="summary-item-price">${item.price} EGP</div>
                </div>
            `).join('');

            orderTotal = currentCart.reduce((sum, item) => sum + parseFloat(item.price || 0), 0);
            document.getElementById('subtotalPrice').innerText = orderTotal + ' EGP';
            document.getElementById('finalTotalPrice').innerText = orderTotal + ' EGP';
        }

        async function submitOrder(e) {
            e.preventDefault();
            if (currentCart.length === 0) return;

            const phoneRegex = /^01[0125][0-9]{8}$/;
            const phone = document.getElementById('custPhone').value.trim();
            const altPhone = document.getElementById('custAltPhone').value.trim();

            if (!phoneRegex.test(phone)) {
                alert('برجاء إدخال رقم هاتف أساسي صحيح (11 رقم يبدأ بـ 01).');
                return;
            }
            if (altPhone && !phoneRegex.test(altPhone)) {
                alert('برجاء إدخال رقم هاتف بديل صحيح، أو اتركه فارغاً.');
                return;
            }

            const btn = document.getElementById('submitOrderBtn');
            btn.innerText = "PROCESSING...";
            btn.disabled = true;

            // تنظيف بيانات السلة وتجهيزها بدون أي قيمة غير معروفة
            const sanitizedCart = currentCart.map(item => ({
                id: item.id || "N/A",
                name: item.name || "Archive Piece",
                price: parseFloat(item.price) || 0,
                image: item.image || "",
                size: item.size || "Free",
                customDetails: item.customDetails || "",
                type: item.type || (item.size === 'Accessory' ? 'accessory' : 'clothing')
            }));

            const orderData = {
                customerInfo: {
                    name: document.getElementById('custName').value.trim(),
                    phone: phone,
                    altPhone: altPhone || '',
                    governorate: document.getElementById('custGov').value.trim(),
                    city: document.getElementById('custCity').value.trim(),
                    address: document.getElementById('custAddress').value.trim()
                },
                paymentInfo: {
                    method: 'الدفع عند الاستلام',
                    transactionID: ''
                },
                paymentStatus: 'غير مدفوع',
                items: sanitizedCart,
                totalAmount: orderTotal,
                status: "قيد المراجعة", 
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                // 1. تسجيل الطلب في Firestore
                const docRef = await db.collection("orders").add(orderData);
                
                // 2. تحديث حالة القطع/المخزون حسب النوع
                for (const item of sanitizedCart) {
                    if (item.id && item.id !== "N/A") {
                        try {
                            if (item.type === 'accessory') {
                                const accRef = db.collection("accessories").doc(item.id);
                                await db.runTransaction(async (transaction) => {
                                    const accDoc = await transaction.get(accRef);
                                    if (accDoc.exists) {
                                        const curStock = parseInt(accDoc.data().stock) || 0;
                                        transaction.update(accRef, { stock: Math.max(0, curStock - 1) });
                                    }
                                });
                            } else {
                                const prodRef = db.collection("products").doc(item.id);
                                const prodDoc = await prodRef.get();
                                if (prodDoc.exists) {
                                    await prodRef.update({ status: "out" });
                                }
                            }
                        } catch (itemErr) {
                            console.warn("Stock update skipped for item:", item.id);
                        }
                    }
                }

                // 3. مسح السلة والتحويل الفوري لصفحة التتبع
                localStorage.removeItem('unoCart');
                window.location.href = "track.html?id=" + docRef.id; 
                
            } catch (error) {
                console.error("خطأ في تسجيل الطلب:", error);
                alert("حدث خطأ أثناء معالجة الطلب، يرجى المحاولة مرة أخرى.");
                btn.innerText = "CONFIRM ORDER";
                btn.disabled = false;
            }
        }
    </script>
</body>
