<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnoVerse | Wishlist</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;700&family=Tajawal:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070707;
            --accent-gold: #D4AF37;
            --text-light: #F4F3EF;
            --gray-card: #111111;
            --gray-border: #222222;
            --text-muted: #888888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg-dark); color: var(--text-light); font-family: 'Tajawal', sans-serif; min-height: 100vh; }

        header {
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--gray-border);
        }

        .brand-logo {
            font-family: 'Oswald', sans-serif;
            font-size: 28px;
            color: #fff;
            text-decoration: none;
            letter-spacing: 4px;
        }
        .brand-logo span { color: var(--accent-gold); }

        .container {
            max-width: 1300px;
            margin: 50px auto;
            padding: 0 5%;
        }

        .page-title {
            font-family: 'Oswald', sans-serif;
            font-size: 32px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--gray-border);
            padding-bottom: 15px;
        }

        .fav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .fav-card {
            background: var(--gray-card);
            border: 1px solid var(--gray-border);
            padding: 15px;
            position: relative;
            transition: 0.3s ease;
        }

        .fav-card:hover { border-color: var(--accent-gold); }

        .fav-card img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            margin-bottom: 15px;
        }

        .fav-card h3 {
            font-family: 'Oswald', sans-serif;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .fav-card .price {
            color: var(--accent-gold);
            font-family: 'Oswald', sans-serif;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .card-actions {
            display: flex;
            gap: 10px;
        }

        .btn-add {
            flex: 1;
            padding: 12px;
            background: var(--accent-gold);
            color: #000;
            border: none;
            font-family: 'Oswald', sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-add:hover { background: #fff; }

        .btn-remove {
            padding: 12px;
            background: transparent;
            color: #ff4d4d;
            border: 1px solid #ff4d4d;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-remove:hover { background: rgba(255,77,77,0.1); }

        .empty-msg {
            text-align: center;
            padding: 80px 0;
            color: var(--text-muted);
            font-family: 'Oswald', sans-serif;
            font-size: 20px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="brand-logo">UNO<span>VERSE</span></a>
        <a href="index.html" style="color:var(--text-light); text-decoration:none; font-family:'Oswald';">← العودة للمتجر</a>
    </header>

    <div class="container">
        <h1 class="page-title">قائمة المفضلة // WISHLIST</h1>
        <div class="fav-grid" id="favGrid"></div>
    </div>

    <script>
        function renderFavorites() {
            const container = document.getElementById('favGrid');
            const favs = JSON.parse(localStorage.getItem('unoFavorites')) || [];

            if (favs.length === 0) {
                container.innerHTML = `<div class="empty-msg" style="grid-column:1/-1;">[ لا يوجد منتجات في المفضلة حالياً ]</div>`;
                return;
            }

            container.innerHTML = '';
            favs.forEach((item, index) => {
                container.innerHTML += `
                    <div class="fav-card">
                        <img src="${item.image}" alt="${item.name}">
                        <h3>${item.name}</h3>
                        <div class="price">${item.price} ج.م</div>
                        <div class="card-actions">
                            <button class="btn-add" onclick="moveToCart(${index})">إضافة للحقيبة</button>
                            <button class="btn-remove" onclick="removeFav(${index})">✕</button>
                        </div>
                    </div>
                `;
            });
        }

        function removeFav(index) {
            let favs = JSON.parse(localStorage.getItem('unoFavorites')) || [];
            favs.splice(index, 1);
            localStorage.setItem('unoFavorites', JSON.stringify(favs));
            renderFavorites();
        }

        function moveToCart(index) {
            let favs = JSON.parse(localStorage.getItem('unoFavorites')) || [];
            let cart = JSON.parse(localStorage.getItem('unoCart')) || [];

            const item = favs[index];
            if (item) {
                cart.push(item);
                localStorage.setItem('unoCart', JSON.stringify(cart));
                alert("تمت إضافة المنتج للحقيبة بنجاح!");
            }
        }

        document.addEventListener('DOMContentLoaded', renderFavorites);
    </script>
    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
