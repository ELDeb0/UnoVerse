<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnoVerse</title>
    
    <link rel="icon" type="image/png" href="icon.png">
    
    <!-- مكتبات Firebase السحابية -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- خطوط UnoVerse -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;700&family=Playfair+Display:ital,wght@0,700;1,700&family=Tajawal:wght@300;400;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* ================= الهوية البصرية الأرشيفية ================= */
        :root {
            --bg-deep: #04060A;       
            --bg-card: #080C14;       
            --text-cream: #E6E1D6;    
            --text-muted: #6B8096;    
            --accent-blue: #4A6B8C;   
            --line-color: rgba(230, 225, 214, 0.08); 
        }

        /* إخفاء الماوس الأصلي إجبارياً من كل عناصر الموقع */
        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; cursor: none !important; }
        *, *::before, *::after { cursor: none !important; }
        
        body { 
            background-color: var(--bg-deep); 
            color: var(--text-cream); 
            font-family: 'Tajawal', sans-serif; 
            overflow-x: hidden; 
            -webkit-font-smoothing: antialiased; 
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
            -webkit-touch-callout: none;
            background-image: url("data:image/svg+xml,%3Csvg width='800' height='800' viewBox='0 0 800 800' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='400' cy='400' r='399' fill='none' stroke='%23E6E1D6' stroke-opacity='0.03' stroke-width='1' stroke-dasharray='4 12'/%3E%3Ccircle cx='400' cy='400' r='200' fill='none' stroke='%23E6E1D6' stroke-opacity='0.02' stroke-width='1' stroke-dasharray='4 12'/%3E%3C/svg%3E");
            background-attachment: fixed;
            background-position: center;
        }

        img { -webkit-user-drag: none; user-drag: none; pointer-events: none; }
        .slide-arrow, .checkout-btn, .close-cart, .login-btn, .size-btn, .add-to-cart-btn, a, button { pointer-events: auto; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 10px; }

        /* ================= النسيج السينمائي ================= */
        .cinematic-grain { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            pointer-events: none; z-index: 99998; opacity: 0.06; 
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); 
        }

        /* ================= الماوس المخصص ================= */
        .cursor-wrapper { 
            position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999999; 
            will-change: transform; mix-blend-mode: exclusion;
        }
        .cursor-dot { 
            width: 12px; height: 12px; background-color: var(--text-cream); border-radius: 50%;
            transform: translate(-50%, -50%) scale(1); 
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.25s ease, box-shadow 0.25s ease; 
        }
        .cursor-wrapper.hovered .cursor-dot { 
            transform: translate(-50%, -50%) scale(5); 
            background-color: transparent; border: 1px solid var(--text-cream); box-shadow: none; 
        }

        /* ================= خلفية الحروف الإنجليزية الفاخرة ================= */
        .eng-typography-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; gap: 5vh; }
        .eng-typography-bg .word-1 { font-family: 'Oswald', sans-serif; font-size: 18vw; font-weight: 700; color: rgba(132, 155, 179, 0.08); line-height: 0.8; white-space: nowrap; will-change: transform; animation: smoothPanRight 45s linear infinite; }
        .eng-typography-bg .word-2 { font-family: 'Playfair Display', serif; font-size: 15vw; font-weight: 900; font-style: italic; color: rgba(132, 155, 179, 0.05); line-height: 0.8; white-space: nowrap; will-change: transform; animation: smoothPanLeft 55s linear infinite; }
        @keyframes smoothPanRight { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(50%, 0, 0); } }
        @keyframes smoothPanLeft { 0% { transform: translate3d(50%, 0, 0); } 100% { transform: translate3d(0, 0, 0); } }

        /* ================= شريط الأخبار الفخم ================= */
        .news-ticker-bar {
            position: fixed; top: 0; left: 0; width: 100%; background: var(--bg-card); color: var(--text-cream);
            z-index: 10000; overflow: hidden; padding: 8px 0; display: none; align-items: center; border-bottom: 1px solid var(--line-color);
        }
        .ticker-track { display: flex; white-space: nowrap; will-change: transform; animation: marqueeScroll 25s linear infinite; }
        .ticker-msg { padding: 0 40px; font-family: 'Oswald', sans-serif; font-size: 11px; font-weight: 300; letter-spacing: 4px; display: inline-block; text-transform: uppercase; color: var(--text-muted);}
        @keyframes marqueeScroll { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(100%, 0, 0); } }

        /* ================= الهيدر ================= */
        .main-header { 
            display: flex; justify-content: space-between; align-items: center; 
            width: 100%; height: 85px; padding: 0 6%; 
            position: fixed; top: 0; right: 0; z-index: 9999; 
            background: linear-gradient(to bottom, rgba(4, 6, 10, 0.9) 0%, rgba(4, 6, 10, 0) 100%); 
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        .main-header.scrolled { 
            height: 65px; background: rgba(4, 6, 10, 0.85); 
            border-bottom: 1px solid var(--line-color); backdrop-filter: blur(15px); 
        }
        
        .main-header .logo { 
            font-family: 'Oswald', sans-serif; font-size: 26px; font-weight: 700; 
            letter-spacing: 6px; text-decoration: none; color: var(--text-cream); 
            transition: 0.4s ease; display: flex; align-items: center; height: 100%;
        }
        .main-header .logo span { color: var(--text-muted); font-weight: 300;}
        .main-header.scrolled .logo { font-size: 20px; }
        
        .main-header .main-nav ul { display: flex; gap: 50px; list-style: none; }
        .main-header .main-nav ul li a { text-decoration: none; color: var(--text-cream); font-family: 'Oswald', sans-serif; font-size: 12px; font-weight: 300; text-transform: uppercase; letter-spacing: 5px; transition: 0.3s; opacity: 0.7;}
        .main-header .main-nav ul li a:hover { opacity: 1; color: #fff;}
        
        .main-header .header-actions { display: flex; gap: 40px; }
        .action-link { color: var(--text-cream); font-family: 'Oswald', sans-serif; text-decoration: none; font-size: 12px; font-weight: 300; text-transform: uppercase; letter-spacing: 4px; transition: 0.3s; opacity: 0.8;}
        .action-link:hover { opacity: 1; color: #fff;}

        /* ================= السلة الجانبية (بدون لاج) ================= */
        .cart-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(4, 6, 10, 0.95); /* إزالة الـ Blur لحل مشكلة التقطيع */
            z-index: 90000; opacity: 0; visibility: hidden; transition: opacity 0.3s ease; 
        }
        .cart-overlay.active { opacity: 1; visibility: visible; }
        
        .cart-drawer { 
            position: fixed; top: 0; right: 0; 
            transform: translate3d(100%, 0, 0); /* إجبار استخدام كارت الشاشة GPU */
            width: 450px; max-width: 100%; height: 100vh; 
            background: var(--bg-deep); border-left: 1px solid var(--line-color); 
            z-index: 99999; 
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); 
            padding: 40px 30px; display: flex; flex-direction: column; 
            will-change: transform; 
        }
        .cart-drawer.active { transform: translate3d(0, 0, 0); }
        
        .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line-color); padding-bottom: 20px; margin-bottom: 20px;}
        .cart-header h3 { font-family: 'Oswald', sans-serif; font-size: 22px; letter-spacing: 6px; color: var(--text-cream); font-weight: 300; text-transform: uppercase;}
        .close-cart { font-size: 24px; transition: 0.3s; color: var(--text-muted); }
        .close-cart:hover { color: var(--text-cream); transform: rotate(90deg); }
        .cart-items { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 25px; padding-right: 10px;}
        .empty-msg { font-family: 'Oswald', sans-serif; color: var(--text-muted); letter-spacing: 4px; text-align: center; margin-top: 50px; text-transform: uppercase; font-size: 12px;}
        .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.03); padding-bottom: 15px; }
        .cart-item img { border: 1px solid var(--line-color); width: 60px; height: 80px; object-fit: cover;}
        .cart-footer { border-top: 1px solid var(--line-color); padding-top: 30px; margin-top: 20px;}
        .cart-total { display: flex; justify-content: space-between; margin-bottom: 25px; font-family: 'Oswald', sans-serif; font-size: 20px; color: var(--text-cream); font-weight: 400; letter-spacing: 2px;}
        .checkout-btn { width: 100%; padding: 20px; background-color: var(--text-cream); color: var(--bg-deep); border: none; font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 6px; transition: 0.4s; text-transform: uppercase;}
        .checkout-btn:hover { background-color: transparent; border: 1px solid var(--text-cream); color: var(--text-cream);}

        /* ================= تفاصيل المنتج (Editorial Layout) ================= */
        .product-container { 
            position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between; 
            min-height: 100vh; padding: 150px 6% 80px 6%; max-width: 1500px; margin: 0 auto; gap: 8%; 
        }

        /* اللوحة اليمين: تفاصيل المنتج */
        .product-details { width: 42%; padding-right: 2%; display: flex; flex-direction: column; justify-content: center; position: relative; }
        
        .product-id-badge { 
            font-family: 'Oswald', sans-serif; font-size: 10px; letter-spacing: 4px; 
            text-transform: uppercase; margin-bottom: 25px; display: inline-flex; align-items: center; gap: 10px; 
            width: fit-content; padding: 6px 14px; transition: 0.3s;
            background: rgba(4, 6, 10, 0.3); backdrop-filter: blur(8px);
            border: 1px solid rgba(230, 225, 214, 0.2); color: var(--text-cream);
        }
        .product-id-badge.sold-out {
            color: var(--text-muted); border-color: rgba(107, 128, 150, 0.3); background: rgba(4, 6, 10, 0.6);
        }

        .product-title { font-family: 'Tajawal', sans-serif; font-size: 42px; font-weight: 800; line-height: 1.2; margin-bottom: 20px; color: var(--text-cream); }
        .product-price { font-family: 'Oswald', sans-serif; font-size: 26px; font-weight: 300; color: var(--text-cream); margin-bottom: 40px; display: flex; align-items: baseline; gap: 15px; letter-spacing: 2px;}
        .product-price .old { font-size: 14px; color: var(--text-muted); text-decoration: line-through; opacity: 0.6;}
        
        .desc-label { font-size: 11px; color: var(--text-muted); margin-bottom: 15px; font-weight: 300; font-family: 'Oswald', sans-serif; letter-spacing: 4px; text-transform: uppercase;}
        .product-desc { font-size: 15px; line-height: 2.2; color: var(--text-muted); font-weight: 300; margin-bottom: 50px; font-family: 'Tajawal', sans-serif;}

        /* المقاسات */
        .sizes-section { margin-bottom: 50px; }
        .size-header { display: flex; justify-content: space-between; font-size: 11px; font-family: 'Oswald', sans-serif; letter-spacing: 2px; color: var(--text-muted); margin-bottom: 15px; font-weight: 300; text-transform: uppercase;}
        .size-grid { display: flex; gap: 12px; flex-wrap: wrap; }
        .size-btn { 
            width: 50px; height: 50px; background: transparent; border: 1px solid var(--line-color); 
            color: var(--text-muted); font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 300;
            transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; 
        }
        .size-btn:not([disabled]):hover { border-color: var(--text-cream); color: var(--text-cream); }
        .size-btn.active { border-color: var(--text-cream); background: var(--text-cream); color: var(--bg-deep); font-weight: 700; }

        /* زر الشراء */
        .add-to-cart-btn { 
            width: 100%; padding: 22px; background: var(--text-cream); color: var(--bg-deep); border: 1px solid var(--text-cream); 
            font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 6px; 
            transition: 0.4s; display: flex; justify-content: center; align-items: center; text-transform: uppercase;
        }
        .add-to-cart-btn:not([disabled]):hover { background: transparent; color: var(--text-cream); }

        /* اللوحة الشمال: معرض الصور والختم الدوار */
        .product-gallery { width: 50%; display: flex; flex-direction: column; align-items: center; position: relative; }
        .seal-1of1 { position: absolute; top: -30px; left: -30px; width: 130px; height: 130px; z-index: 20; background: var(--bg-deep); border-radius: 50%; border: 1px solid var(--line-color); display: flex; justify-content: center; align-items: center; transition: 0.3s; }
        .seal-text { position: absolute; width: 100%; height: 100%; animation: rotateSeal 20s linear infinite; }
        .seal-text svg { width: 100%; height: 100%; fill: var(--text-muted); font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 300; letter-spacing: 3px;}
        .seal-center { font-family: 'Playfair Display', serif; font-size: 30px; font-weight: 900; color: var(--text-cream); font-style: italic; }
        @keyframes rotateSeal { 100% { transform: rotate(360deg); } }

        .spotlight-wrapper { 
            width: 100%; height: 75vh; min-height: 550px; 
            background: var(--bg-card); border: 1px solid var(--line-color); 
            position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; padding: 20px;
        }
        .main-image { max-width: 100%; max-height: 100%; object-fit: contain; transition: opacity 0.4s ease; pointer-events: none; filter: grayscale(0.2) contrast(1.1);}
        .lens { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; background-repeat: no-repeat; transition: opacity 0.4s; z-index: 2; }
        .spotlight-wrapper:hover .main-image { opacity: 0.2; filter: grayscale(1); }
        .spotlight-wrapper:hover .lens { opacity: 1; }

        .thumbnails-strip { display: flex; gap: 15px; margin-top: 25px; width: 100%; justify-content: center; flex-wrap: wrap; }
        .thumb { width: 70px; height: 90px; border: 1px solid var(--line-color); background: var(--bg-card); opacity: 0.4; transition: 0.3s; }
        .thumb img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; filter: grayscale(0.5);}
        .thumb.active, .thumb:hover { opacity: 1; border-color: var(--text-cream); }
        .thumb.active img, .thumb:hover img { filter: grayscale(0);}

        /* ================= INFO TABS ================= */
        .info-tabs-container { position: relative; z-index: 10; width: 90%; max-width: 1500px; margin: 0 auto 100px auto; border-top: 1px solid var(--line-color); border-bottom: 1px solid var(--line-color); display: flex; background: transparent; }
        .tab-col { flex: 1; padding: 50px 40px; border-left: 1px solid var(--line-color); text-align: center;}
        .tab-col:first-child { border-left: none; }
        .tab-title { font-family: 'Oswald', sans-serif; font-size: 13px; color: var(--text-cream); margin-bottom: 20px; font-weight: 300; letter-spacing: 4px; text-transform: uppercase;}
        .tab-text { font-size: 13px; color: var(--text-muted); line-height: 2.4; font-weight: 300;}

        /* ================= الفوتر ================= */
        footer { position: relative; z-index: 10; padding: 40px 5%; border-top: 1px solid var(--line-color); text-align: center; color: var(--text-muted); font-size: 11px; font-family: 'Oswald', sans-serif; letter-spacing: 4px; background: var(--bg-deep); text-transform: uppercase;}
        footer span { color: var(--text-cream); font-weight: 400;}

        /* ================= الموبايل والشاشات الصغيرة ================= */
        @media (max-width: 992px) {
            .main-header { padding: 15px 5%; height: 75px;}
            .main-header .logo { font-size: 20px; letter-spacing: 3px; }
            .main-nav { display: none; } 
            .header-actions { gap: 15px; }
            .action-link { font-size: 11px; letter-spacing: 1px; }

            .product-container { flex-direction: column-reverse; padding: 100px 5% 40px; gap: 30px; }
            .product-details, .product-gallery { width: 100%; padding: 0; }
            
            .spotlight-wrapper { height: auto; aspect-ratio: 3/4; min-height: 400px; padding: 10px; }
            .spotlight-wrapper:hover .main-image { opacity: 1; filter: grayscale(0.2) contrast(1.1); }
            .lens { display: none !important; } /* تعطيل الزووم في الموبايل */
            
            .seal-1of1 { top: -15px; left: -10px; width: 90px; height: 90px; }
            .seal-center { font-size: 20px; }
            
            .product-title { font-size: 28px; margin-bottom: 10px; }
            .product-price { font-size: 22px; margin-bottom: 25px; }
            .product-desc { font-size: 13px; line-height: 2; margin-bottom: 30px; }
            
            .size-btn { width: 45px; height: 45px; font-size: 12px; }
            .sizes-section { margin-bottom: 30px; }
            .add-to-cart-btn { padding: 18px; font-size: 13px; letter-spacing: 4px; }
            
            .info-tabs-container { flex-direction: column; width: 100%; border: none; margin-bottom: 50px;}
            .tab-col { border-left: none; border-bottom: 1px solid var(--line-color); padding: 25px 5%; border-top: 1px solid var(--line-color);}
            .tab-col:first-child { border-top: none; }
            
            .cart-drawer { width: 100%; padding: 25px 20px;}
        }
    </style>
</head>
<body>

    <div class="cinematic-grain"></div>

    <div class="news-ticker-bar" id="newsTickerBar">
        <div class="ticker-track" id="tickerTrack"></div>
    </div>

    <div class="eng-typography-bg">
        <div class="word-1">UNOVERSE</div>
        <div class="word-2">ONE OF ONE ARCHIVE</div>
        <div class="word-1" style="font-size: 15vw; opacity: 0.5;">EXCLUSIVE</div>
    </div>

    <!-- الماوس المخصص -->
    <div class="cursor-wrapper" id="cursorWrapper"><div class="cursor-dot"></div></div>

    <!-- السلة الجانبية -->
    <div class="cart-overlay" id="cartOverlay"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3>CART.</h3>
            <span class="close-cart" id="closeCart">✕</span>
        </div>
        <div class="cart-items" id="cartItemsContainer">
            <p class="empty-msg">EMPTY ARCHIVE.</p>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>TOTAL</span>
                <span id="cartTotalPrice">0 EGP</span>
            </div>
            <button class="checkout-btn" onclick="window.location.href='checkout.html'">CHECKOUT</button>        
        </div>
    </div>

    <header class="main-header" id="mainHeader">
        <a href="index.html" class="logo" dir="ltr">UNO<span>VERSE</span></a>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html#hero">HOME</a></li>
                <li><a href="index.html#support">SUPPORT</a></li>
            </ul>
        </nav>
        <div class="header-actions">
            <a href="#" id="openCart" class="action-link">CART [<span id="cartBadge">0</span>]</a>
        </div>
    </header>

    <main id="productPageContent">
        <div style="position:relative; z-index:10; width: 100%; text-align: center; padding: 250px 0; font-family: 'Oswald', sans-serif; letter-spacing: 5px; color: var(--text-muted);">
            LOADING EXCLUSIVE PIECE...
        </div>
    </main>

    <footer>
        <p>© 2026 <span>UNOVERSE</span>. ALL RIGHTS RESERVED. 1 OF 1 EXCLUSIVE PIECES.</p>
    </footer>

    <script>
        // ================= حماية المحتوى =================
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', function(e) {
            if(e.keyCode == 123) { e.preventDefault(); return false; }
            if(e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) { e.preventDefault(); return false; }
            if(e.ctrlKey && e.keyCode == 85) { e.preventDefault(); return false; }
            if(e.ctrlKey && e.keyCode == 67) { e.preventDefault(); return false; }
        });
        document.addEventListener('dragstart', function(e) {
            if(e.target.nodeName.toUpperCase() == "IMG") { e.preventDefault(); }
        });

        // ================= Firebase =================
        const firebaseConfig = {
            apiKey: "AIzaSyDlDEAKoMteNLtvbSaq5I9VKpGq29gLDmY",
            authDomain: "unoverse-5babd.firebaseapp.com",
            projectId: "unoverse-5babd",
            storageBucket: "unoverse-5babd.firebasestorage.app",
            messagingSenderId: "543082257571",
            appId: "1:543082257571:web:28b1d5931cbc75e6793316"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ================= الماوس المخصص =================
        const cursorWrapper = document.getElementById('cursorWrapper');
        let mouseX = -100, mouseY = -100;
        let cursorX = -100, cursorY = -100;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animateCursor() {
            cursorX += (mouseX - cursorX) * 0.25;
            cursorY += (mouseY - cursorY) * 0.25;
            cursorWrapper.style.transform = `translate3d(${cursorX}px, ${cursorY}px, 0)`;
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // دالة جعل الماوس يظهر عند التفاعل
        function addHover() { cursorWrapper.classList.add('hovered'); }
        function removeHover() { cursorWrapper.classList.remove('hovered'); }

        function attachCursorEffects() {
            const interactiveElements = document.querySelectorAll('a, button, input, textarea, .thumb, .spotlight-wrapper, .size-btn, .close-cart, .add-to-cart-btn');
            interactiveElements.forEach(el => {
                el.removeEventListener('mouseenter', addHover);
                el.removeEventListener('mouseleave', removeHover);
                el.addEventListener('mouseenter', addHover);
                el.addEventListener('mouseleave', removeHover);
            });
        }

        // ================= شريط الأخبار =================
        function applyTickerText(customProductTicker) {
            const tickerBar = document.getElementById('newsTickerBar');
            const header = document.getElementById('mainHeader');
            const track = document.getElementById('tickerTrack');

            if (customProductTicker && typeof customProductTicker === 'string' && customProductTicker.trim() !== '') {
                tickerBar.style.display = 'flex';
                header.style.top = window.scrollY > 50 ? '0px' : '35px'; 
                track.innerHTML = '';
                for(let i=0; i<10; i++) {
                    track.innerHTML += `<span class="ticker-msg">✦ ${customProductTicker} ✦</span>`;
                }
            } else {
                tickerBar.style.display = 'none';
                header.style.top = '0px'; 
            }
        }

        // ================= جلب المنتج =================
        const urlParams = new URLSearchParams(window.location.search);
        const currentProductId = urlParams.get('id');
        let selectedSize = '';
        let currentProductData = null;

        async function fetchProductData() {
            const wrapper = document.getElementById('productPageContent');
            if (!currentProductId) {
                wrapper.innerHTML = '<h2 style="position:relative; z-index:10; width:100%; text-align:center; padding:200px 0; color:var(--text-muted); font-family:Oswald; letter-spacing:4px;">NO PIECE SELECTED.</h2>';
                applyTickerText(null); 
                return;
            }
            try {
                const doc = await db.collection("products").doc(currentProductId).get();
                if (!doc.exists) {
                    wrapper.innerHTML = '<h2 style="position:relative; z-index:10; width:100%; text-align:center; padding:200px 0; color:var(--text-muted); font-family:Oswald; letter-spacing:4px;">PIECE IS UNAVAILABLE OR ARCHIVED.</h2>';
                    applyTickerText(null); 
                    return;
                }
                currentProductData = doc.data();
                currentProductData.id = doc.id;
                renderProductPage(currentProductData);
            } catch (err) {
                console.error("Error:", err);
                applyTickerText(null); 
            }
        }

        function renderProductPage(prod) {
            const wrapper = document.getElementById('productPageContent');
            const price = parseFloat(prod.price) || 0;
            const discount = parseFloat(prod.discount) || price;
            
            applyTickerText(prod.tickerText);
            
            let priceHTML = (discount < price)
                ? `<span>${discount} EGP</span> <span class="old">${price} EGP</span>`
                : `<span>${price} EGP</span>`;

            let gallery = (prod.gallery && prod.gallery.length > 0) ? prod.gallery : [prod.image];
            let activeMainImg = gallery[0];

            let thumbsHTML = gallery.map((img, i) => `
                <div class="thumb ${i===0?'active':''}" onclick="changeMainImage(this, '${img}')">
                    <img src="${img}" alt="Thumb">
                </div>
            `).join('');

            const isSoldOut = prod.status === 'out';
            let sealColor = isSoldOut ? 'var(--text-muted)' : 'var(--text-cream)';
            let sealText = isSoldOut ? 'ARCHIVED PIECE ✦ UNAVAILABLE ✦ ' : 'UNOVERSE ✦ 1 OF 1 EXCLUSIVE ✦ ';
            let badgeStyle = isSoldOut ? 'color: var(--text-muted); border-color: rgba(107, 128, 150, 0.3); background: rgba(4, 6, 10, 0.6);' : '';
            let badgeText = isSoldOut ? 'ARCHIVED // SOLD OUT' : `EDITION: ${prod.id.slice(-6).toUpperCase()}`;

            let sizes = prod.sizes || ['S', 'M', 'L', 'XL'];
            selectedSize = isSoldOut ? 'N/A' : sizes[0]; 
            let sizesHTML = sizes.map((s, i) => {
                let activeClass = (i===0 && !isSoldOut) ? 'active' : '';
                let disabledAttr = isSoldOut ? 'disabled style="opacity:0.2; cursor:not-allowed !important;"' : '';
                return `<button type="button" class="size-btn ${activeClass}" ${disabledAttr} onclick="${isSoldOut ? '' : `selectSize(this, '${s}')`}">${s}</button>`;
            }).join('');

            let btnHTML = isSoldOut 
                ? `<button class="add-to-cart-btn" style="background:transparent; color:var(--text-muted); border-color:var(--line-color); cursor:not-allowed !important;" disabled>
                       <span>ARCHIVED (SOLD OUT)</span>
                   </button>`
                : `<button class="add-to-cart-btn" onclick="addToCartDetailed()">
                       <span>ADD TO CART</span>
                   </button>`;

            wrapper.innerHTML = `
                <div class="product-container">
                    
                    <div class="product-details">
                        <div class="product-id-badge" style="${badgeStyle}">${badgeText}</div>
                        <h1 class="product-title">${prod.name}</h1>
                        <div class="product-price">${priceHTML}</div>
                        <div class="desc-label">DESCRIPTION //</div>
                        <p class="product-desc">${prod.description || 'إصدار حصري مميز جداً. تعكس هذه القطعة فخامة الخامات وجودة التنفيذ العالية التي تتميز بها علامة UnoVerse. تصميم فريد بإنتاج فردي (1 of 1).'}</p>
                        
                        <div class="sizes-section">
                            <div class="size-header">
                                <span>SIZE // <strong id="selectedSizeLabel" style="color:var(--text-cream); margin-right:5px; font-weight:400;">${selectedSize}</strong></span>
                            </div>
                            <div class="size-grid">${sizesHTML}</div>
                        </div>
                        ${btnHTML}
                    </div>

                    <div class="product-gallery">
                        <div class="seal-1of1">
                            <div class="seal-text">
                                <svg viewBox="0 0 100 100">
                                    <path d="M 50, 50 m -35, 0 a 35,35 0 1,1 70,0 a 35,35 0 1,1 -70,0" id="circlePath" fill="none"/>
                                    <text><textPath href="#circlePath" startOffset="0%" fill="${sealColor}">${sealText}</textPath></text>
                                </svg>
                            </div>
                            <div class="seal-center">1/1</div>
                        </div>

                        <div class="spotlight-wrapper" id="zoomContainer">
                            <img id="mainArtImg" class="main-image" src="${activeMainImg}" alt="${prod.name}">
                            <div class="lens" id="artLens" style="background-image: url('${activeMainImg}');"></div>
                        </div>
                        <div class="thumbnails-strip">${thumbsHTML}</div>
                    </div>
                </div>

                <div class="info-tabs-container">
                    <div class="tab-col">
                        <h4 class="tab-title">MATERIALS ✦</h4>
                        <p class="tab-text">يتم اختيار الأقمشة الثقيلة والمعالجة بدقة لضمان المتانة والشكل الانسيابي الفاخر، مع اهتمام بالغ بجودة الخياطة اليدوية والتفاصيل النهائية.</p>
                    </div>
                    <div class="tab-col">
                        <h4 class="tab-title">SHIPPING ✦</h4>
                        <p class="tab-text">تُغلف القطعة في صناديق UnoVerse المميزة التي تحافظ عليها أثناء النقل. يتم التوصيل السريع والمؤمن لضمان وصول القطعة إليك في أفضل حالة.</p>
                    </div>
                    <div class="tab-col">
                        <h4 class="tab-title">POLICY ✦</h4>
                        <p class="tab-text">جميع قطعنا هي إصدارات فردية بتصميم (1 of 1). بمجرد إتمامك للطلب، يتم إزالة القطعة من الموقع نهائياً وتصبح حصرياً ملكاً لك وحدك.</p>
                    </div>
                </div>
            `;

            initImageZoom();
            attachCursorEffects(); 
        }

        function changeMainImage(thumb, src) {
            document.getElementById('mainArtImg').src = src;
            document.getElementById('artLens').style.backgroundImage = `url('${src}')`;
            document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
            thumb.classList.add('active');
        }

        function initImageZoom() {
            const container = document.getElementById('zoomContainer');
            const lens = document.getElementById('artLens');

            container.addEventListener('mousemove', (e) => {
                const rect = container.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const xPercent = (x / rect.width) * 100;
                const yPercent = (y / rect.height) * 100;

                lens.style.backgroundPosition = `${xPercent}% ${yPercent}%`;
                lens.style.backgroundSize = '220%'; 
            });
        }

        function selectSize(btn, size) {
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedSize = size;
            document.getElementById('selectedSizeLabel').innerText = size;
        }

        function addToCartDetailed() {
            if (!currentProductData || currentProductData.status === 'out') return;
            let cart = JSON.parse(localStorage.getItem('unoCart')) || [];
            const isAlreadyInCart = cart.some(item => item.id === currentProductData.id);

            if (isAlreadyInCart) {
                alert('هذه القطعة الحصرية موجودة بالفعل في حقيبتك!');
                document.getElementById('cartDrawer').classList.add('active');
                document.getElementById('cartOverlay').classList.add('active');
                return; 
            }

            const item = {
                id: currentProductData.id,
                name: currentProductData.name,
                price: currentProductData.discount || currentProductData.price,
                image: currentProductData.image,
                size: selectedSize
            };

            cart.push(item);
            localStorage.setItem('unoCart', JSON.stringify(cart));
            updateCartUI();

            document.getElementById('cartDrawer').classList.add('active');
            document.getElementById('cartOverlay').classList.add('active');
        }

        function updateCartUI() {
            const cart = JSON.parse(localStorage.getItem('unoCart')) || [];
            const container = document.getElementById('cartItemsContainer');
            const badge = document.getElementById('cartBadge');
            
            if (badge) badge.innerText = cart.length;
            if (!container) return;

            if (cart.length === 0) {
                container.innerHTML = '<p class="empty-msg">EMPTY ARCHIVE.</p>';
            } else {
                container.innerHTML = cart.map((item, idx) => `
                    <div class="cart-item">
                        <img src="${item.image}" alt="${item.name}">
                        <div class="cart-item-info" style="flex:1; padding:0 15px; text-align:left;">
                            <h4 style="color:var(--text-cream); font-family:'Oswald'; font-weight:400; font-size:14px; text-transform:uppercase;">${item.name}</h4>
                            <p style="color:var(--text-muted); font-size:12px; margin-top:5px; font-family:'Oswald'; letter-spacing:2px;">SIZE: ${item.size} // ${item.price} EGP</p>
                        </div>
                        <button onclick="removeFromCart(${idx})" style="background:none; border:none; color:var(--text-muted); font-size:18px; cursor:pointer; font-family:'Oswald', sans-serif; transition: 0.3s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='var(--text-muted)'">✕</button>
                    </div>
                `).join('');
            }

            const total = cart.reduce((sum, item) => sum + parseFloat(item.price || 0), 0);
            const totalEl = document.getElementById('cartTotalPrice');
            if (totalEl) totalEl.innerText = total + ' EGP';
            attachCursorEffects();
        }

        function removeFromCart(index) {
            let cart = JSON.parse(localStorage.getItem('unoCart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('unoCart', JSON.stringify(cart));
            updateCartUI();
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchProductData();
            updateCartUI();
            attachCursorEffects();

            window.addEventListener('scroll', () => {
                const header = document.getElementById('mainHeader');
                const ticker = document.getElementById('newsTickerBar');
                const hasTicker = ticker.style.display === 'flex';
                
                if(window.scrollY > 50) {
                    header.style.top = '0px';
                    if(hasTicker) ticker.style.transform = 'translateY(-100%)';
                } else {
                    header.style.top = hasTicker ? '35px' : '0px'; 
                    if(hasTicker) ticker.style.transform = 'translateY(0)';
                }
            });

            document.getElementById('openCart')?.addEventListener('click', (e) => { e.preventDefault(); document.getElementById('cartDrawer').classList.add('active'); document.getElementById('cartOverlay').classList.add('active'); });
            document.getElementById('closeCart')?.addEventListener('click', () => { document.getElementById('cartDrawer').classList.remove('active'); document.getElementById('cartOverlay').classList.remove('active'); });
            document.getElementById('cartOverlay')?.addEventListener('click', () => { document.getElementById('cartDrawer').classList.remove('active'); document.getElementById('cartOverlay').classList.remove('active'); });
        });
    </script>
</body>
</html>
